name: Update liquidity data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "casablanca_source.py"
      - "collect_market.py"
      - "collect_equities.py"
      - "rank_equities.py"
      - "technical.py"
      - "equity_store.py"
      - "backtest_technical.py"
      - "collect_bulletin.py"
      - "collect_dividends.py"
      - "collect_fundamentals.py"
      - "extract_financials.py"
      - "ocr_pdf.py"
      - "market_rotation.py"
      - "data/fundamentals_sources.json"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "20 18 * * 1-5"
permissions:
  contents: write
# Un seul workflow à la fois peut pousser des données sur main.
concurrency:
  group: data-push-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Se placer sur le dernier main (exécutions mises en file d'attente)
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Outils OCR (PDF publiés sans couche texte)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra poppler-utils
      - name: Unit tests (bloquants)
        run: python -m unittest -v test_global_collector.py test_bam_collector.py test_equity_rankings.py test_backfill_equities.py test_equity_fallback.py test_equity_public_archive.py test_backtest_sync.py test_casablanca_collectors.py test_technical.py test_equity_store.py test_backtest_technical.py test_masi_history.py test_bulletin.py test_dividends.py test_fundamentals.py test_ocr.py test_market_rotation.py test_liquidity_confidence.py
      - name: MASI officiel (clôture de séance, Bourse de Casablanca)
        id: masi
        continue-on-error: true
        run: python collect_market.py
      - name: Collect BAM and AMMC liquidity
        id: liquidity
        continue-on-error: true
        run: python collect_liquidity.py
      - name: Discover BAM liquidity publications
        id: bam
        continue-on-error: true
        run: python collect_bam.py
      - name: Collect global risk inputs
        id: global
        continue-on-error: true
        run: python collect_global.py
      - name: Historique OHLCV officiel des actions (Bourse de Casablanca)
        id: equities
        continue-on-error: true
        run: python collect_equities.py
      - name: Référentiel émetteurs (bulletin de la cote - ISIN, titres, dividendes)
        id: bulletin
        continue-on-error: true
        run: python collect_bulletin.py
      - name: Calendrier financier (dividendes et assemblées générales)
        id: dividends
        continue-on-error: true
        run: python collect_dividends.py
      - name: Fondamentaux (comptes annuels publiés)
        id: fundamentals
        continue-on-error: true
        run: python collect_fundamentals.py
      - name: Recalculate dashboard
        run: python update.py
      - name: Rotation de la dernière séance (cours officiels)
        run: python market_rotation.py
      - name: Run diagnostic backtest (synchronise aussi dashboard.json)
        run: python backtest.py
      - name: Build equity fundamental and technical rankings
        run: python rank_equities.py
      - name: Backtest du score technique (sans regard vers le futur)
        run: python backtest_technical.py
      - name: Verify dashboard renders with current data (bloquant)
        run: node test_dashboard.cjs && node test_societe.cjs
      - name: Preserve collector diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-reports
          path: |
            data/masi_collection_report.json
            data/equity_collection_report.json
          if-no-files-found: warn
      - name: Commit refreshed data
        run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: refresh market radar"
          git pull --rebase origin main
          git push
      - name: Collector status report
        if: always()
        env:
          MASI: ${{ steps.masi.outcome }}
          LIQ: ${{ steps.liquidity.outcome }}
          BAM: ${{ steps.bam.outcome }}
          GLOBAL: ${{ steps.global.outcome }}
          EQ: ${{ steps.equities.outcome }}
          BUL: ${{ steps.bulletin.outcome }}
          FUND: ${{ steps.fundamentals.outcome }}
          DIV: ${{ steps.dividends.outcome }}
        run: |
          {
            echo "## État des collecteurs"
            echo "| Collecteur | Rôle | Résultat |"
            echo "|---|---|---|"
            echo "| collect_market.py | MASI officiel (cœur) | $MASI |"
            echo "| collect_equities.py | Historique actions officiel (cœur) | $EQ |"
            echo "| collect_bulletin.py | Référentiel émetteurs / dividendes | $BUL |"
            echo "| collect_fundamentals.py | Fondamentaux (comptes publiés) | $FUND |"
            echo "| collect_dividends.py | Calendrier des dividendes | $DIV |"
            echo "| collect_liquidity.py | BAM/AMMC (cœur) | $LIQ |"
            echo "| collect_bam.py | Publications BAM (cœur) | $BAM |"
            echo "| collect_global.py | Risque global (cœur) | $GLOBAL |"
            [ -f data/masi_collection_report.json ] && { echo; echo '```json'; cat data/masi_collection_report.json; echo '```'; }
          } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          for v in "MASI:$MASI" "EQ:$EQ" "BUL:$BUL" "FUND:$FUND" "LIQ:$LIQ" "BAM:$BAM" "GLOBAL:$GLOBAL"; do
            if [ "${v#*:}" = "failure" ]; then echo "::error::Collecteur cœur en échec : ${v%%:*}"; fail=1; fi
          done
          exit $fail
