name: Backfill long MASI history
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-push-main
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Se placer sur le dernier main (exécutions mises en file d'attente)
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Extend historical market series
        run: python backfill_market.py
      - name: Recalculate radar
        run: python update.py
      - name: Rebuild backtest
        run: python backtest.py
      - name: Commit historical dataset
        run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: extend historical MASI series"
          git pull --rebase origin main
          git push
