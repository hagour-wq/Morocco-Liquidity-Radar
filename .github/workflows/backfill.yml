name: Backfill Casablanca history
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backfill validated official bulletins
        run: python backfill_market.py
      - name: Recalculate Market Flow
        run: python update.py
      - name: Commit validated history
        run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: backfill official Casablanca history"
          git push
