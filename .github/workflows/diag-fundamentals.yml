name: Essai fondamentaux (branche)
on:
  push:
    branches: ["claude/etape13-*"]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collect_bulletin.py
      - run: python collect_fundamentals.py || true
      - run: python rank_equities.py
      - name: Commit sur la branche d'essai uniquement
        run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/company_fundamentals.json data/issuer_reference.json data/equity_rankings.json
          git diff --cached --quiet || git commit -m "essai: fondamentaux [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
