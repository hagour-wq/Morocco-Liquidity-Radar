name: Essai fondamentaux (branche)
on:
  push:
    branches: ["claude/etape15-*"]
permissions:
  contents: write
jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra poppler-utils
      - run: python -m unittest -v test_fundamentals test_ocr > data/ocr_test_log.txt 2>&1 || true
      - run: python collect_bulletin.py
      - run: python collect_fundamentals.py || true
      - run: python rank_equities.py
      - name: Textes OCR (diagnostic)
        run: |
          python - <<'PY'
          import json, io, casablanca_source as cb, ocr_pdf
          from pypdf import PdfReader
          out = {}
          for s in json.load(open("data/fundamentals_sources.json"))["issuers"]:
              if s["ticker"] in ("IAM","AFI","RDS","SBM","SNA","AFM","AGM","ATL"):
                  b = cb._get(s["url"], accept="application/pdf")
                  t, info = ocr_pdf.ocr_pdf(b)
                  out[s["ticker"]] = {"info": info, "text": t}
          json.dump(out, open("data/ocr_diagnostic.json","w"), ensure_ascii=False, indent=1)
          PY
      - name: Commit sur la branche d'essai uniquement
        run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/company_fundamentals.json data/issuer_reference.json data/equity_rankings.json data/ocr_diagnostic.json data/ocr_test_log.txt
          git diff --cached --quiet || git commit -m "essai: fondamentaux OCR [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
