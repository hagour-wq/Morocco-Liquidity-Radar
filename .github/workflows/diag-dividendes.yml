name: Diagnostic calendrier des dividendes (branche)
on:
  push:
    branches: ["claude/diag-dividendes"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python diag/dividendes_probe.py || true
      - run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/diag_dividendes.json
          git diff --cached --quiet || git commit -m "diag: dividendes [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
