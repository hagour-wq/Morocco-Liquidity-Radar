name: Diagnostic accès Bourse de Casablanca
on:
  push:
    branches: ["claude/diag-*"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest test_masi_history.py
      - run: python collect_masi_history.py
      - name: Commit diagnostic sur la branche de diagnostic uniquement
        if: always()
        run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/masi_official.json data/masi_history_report.json data/market_history.json
          git diff --cached --quiet || git commit -m "diag: archives PDF MASI [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
