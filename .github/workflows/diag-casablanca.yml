name: Diagnostic accès Bourse de Casablanca
on:
  push:
    branches: ["claude/diag-*"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest test_casablanca_collectors.py
      - name: MASI officiel
        continue-on-error: true
        run: python collect_market.py
      - name: Historique actions officiel (5 pilotes)
        continue-on-error: true
        run: python collect_equities.py
      - run: python update.py
      - run: python backtest.py
      - run: python rank_equities.py
      - run: node test_dashboard.cjs
      - name: Commit diagnostic sur la branche de diagnostic uniquement
        if: always()
        run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/
          git diff --cached --quiet || git commit -m "diag: collecte officielle de test [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
