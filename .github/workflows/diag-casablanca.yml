name: Diagnostic accès Bourse de Casablanca
on:
  push:
    branches: ["claude/diag-*"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install certifi==2026.7.22
      - run: python probe_casablanca.py
      - name: Commit diagnostic sur la branche de diagnostic uniquement
        run: |
          git config user.name "mlr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f diag/
          git diff --cached --quiet || git commit -m "diag: probe casablanca-bourse.com [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
